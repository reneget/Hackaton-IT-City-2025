{% extends "base.html" %}
{% block title %}Вход клиента{% endblock %}
{% block body %}
<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#0b1d2a 0%,#0f2a3d 100%);overflow:auto">
  <div style="width:100%;max-width:420px;padding:48px 40px 40px;background:#0f2230;border:1px solid rgba(255,255,255,0.08);border-radius:16px;box-shadow:0 12px 32px rgba(0,0,0,0.4);color:#e6f2f9">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px">
      <div style="width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,#00d4ff 0%,#0077ff 100%);box-shadow:0 4px 14px rgba(0,136,255,0.45)"></div>
      <div style="font-size:18px;font-weight:600;letter-spacing:.3px">Client</div>
    </div>
    <h1 style="margin:0;color:#fff;font-size:28px;line-height:1.25;font-weight:700">Вход в систему</h1>
    <form method="post" action="/client/login">
      <label style="display:block;color:#b9d2df;font-size:13px;margin:12px 0 8px">Логин</label>
      <input name="username" required placeholder="name@example.com" style="width:100%;padding:14px;border-radius:10px;border:1px solid rgba(255,255,255,0.08);background:#0b1d2a;color:#e6f2f9;box-sizing:border-box" />
      <label style="display:block;color:#b9d2df;font-size:13px;margin:14px 0 8px">Пароль</label>
      <input name="password" type="password" required placeholder="••••••••" style="width:100%;padding:14px;border-radius:10px;border:1px solid rgba(255,255,255,0.08);background:#0b1d2a;color:#e6f2f9;box-sizing:border-box" />
      <button style="width:100%;margin-top:18px;padding:14px 18px;border-radius:10px;border:1px solid rgba(0,180,255,0.6);background:linear-gradient(135deg,#00d4ff 0%,#0077ff 100%);color:#062030;font-weight:700;letter-spacing:.2px;cursor:pointer;box-shadow:0 10px 22px rgba(0,140,255,0.35)">Войти</button>
    </form>
  </div>
  </div>
{% endblock %}
